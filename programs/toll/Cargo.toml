[package]
name = "toll"
version = "0.1.0"
description = "Bounty launchpad for open problems on Meteora DBC"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "toll"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
meteortoll = { path = "../.." }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
solana-sha256-hasher = "3"
solana-sdk-ids = "3"

[dev-dependencies]
litesvm = "0.15.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
