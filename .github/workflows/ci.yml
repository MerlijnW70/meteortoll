name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w app
      - run: npm test -w client
      - run: npm run lint -w app
      - run: npm run build -w app

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo test -p meteortoll --quiet

  program:
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: v4.1.2
      ANCHOR_VERSION: 1.2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.cargo/registry
            target
          key: program-${{ env.SOLANA_VERSION }}-${{ hashFiles('Cargo.lock') }}
      - name: Solana toolchain
        run: |
          [ -x "$HOME/.local/share/solana/install/active_release/bin/solana" ] || sh -c "$(curl -sSfL "https://release.anza.xyz/$SOLANA_VERSION/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Meteora and Metaplex programs from mainnet
        run: |
          mkdir -p programs/toll/tests/fixtures
          solana program dump -u mainnet-beta dbcij3LWUppWqq96dh6gJWwBifmcGfLSB5D4DuSMaqN programs/toll/tests/fixtures/dbc.so
          solana program dump -u mainnet-beta cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG programs/toll/tests/fixtures/damm_v2.so
          solana program dump -u mainnet-beta metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s programs/toll/tests/fixtures/mpl_token_metadata.so
      - name: Build
        run: npx --yes "@anchor-lang/cli@$ANCHOR_VERSION" build --arch v0
      - name: The checked-in IDL matches the build
        run: diff <(jq -S . target/idl/toll.json) <(jq -S . packages/core/src/idl/toll.json)
      - run: cargo test -p toll --quiet
      - name: Program hash
        run: |
          sha256sum target/deploy/toll.so | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l target/deploy/toll.so | tee -a "$GITHUB_STEP_SUMMARY"

  verifiable:
    runs-on: ubuntu-latest
    needs: program
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-0.5.2
      - run: '[ -x ~/.cargo/bin/solana-verify ] || cargo install solana-verify --version 0.5.2 --locked'
      - name: Build in the verifiable container
        run: ~/.cargo/bin/solana-verify build --library-name toll --base-image solanafoundation/solana-verifiable-build:4.1.2
      - name: Program hash
        run: ~/.cargo/bin/solana-verify get-executable-hash target/deploy/toll.so | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toll-verifiable
          path: target/deploy/toll.so
          retention-days: 90

  e2e:
    runs-on: ubuntu-latest
    env:
      HAS_RPC: ${{ secrets.SOLANA_RPC_URL != '' }}
    steps:
      - name: Need a dedicated RPC
        id: rpc
        run: |
          if [ "$HAS_RPC" != "true" ]; then
            echo "::notice::Browser tests skipped: add a SOLANA_RPC_URL repository secret (a devnet RPC URL) to run them."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.rpc.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: steps.rpc.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - if: steps.rpc.outputs.ready == 'true'
        run: npm ci
      - if: steps.rpc.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
        working-directory: app
      - if: steps.rpc.outputs.ready == 'true'
        run: npm run build -w app
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      - if: steps.rpc.outputs.ready == 'true'
        run: npm run e2e -w app
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: app/test-results
          retention-days: 7
